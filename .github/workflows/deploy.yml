name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push waits for the running deploy, so two never touch the box at once.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  IMAGE: ghcr.io/marvinpescos/lexchain-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # out/ is gitignored, and the app reads the contract ABI from it.
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Compile the contract
        working-directory: blockchain
        run: forge build --skip test --skip script
      - name: Add the ABI to the build context
        run: |
          mkdir -p backend/blockchain/out/LexChainNotary.sol
          cp blockchain/out/LexChainNotary.sol/LexChainNotary.json backend/blockchain/out/LexChainNotary.sol/

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry cache keeps the dependency layers identical between
      # builds, so a code change only sends the box the last layer.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out on the box
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          compose=$(base64 -w0 backend/docker-compose.prod.yml)
          script=$(cat <<SCRIPT
          set -eu
          cd /opt/lexchain
          echo '$compose' | base64 -d > docker-compose.yml
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker compose pull
          docker logout ghcr.io
          docker compose up -d --remove-orphans
          for i in \$(seq 1 30); do
            status=\$(docker inspect -f '{{.State.Health.Status}}' lexChain-backend)
            echo "backend: \$status"
            [ "\$status" = healthy ] && break
            [ "\$i" = 30 ] && { docker compose logs --tail 50 backend; exit 1; }
            sleep 10
          done
          docker image prune -af
          SCRIPT
          )
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["1800"]}')" \
            --query Command.CommandId --output text)

          # The first deploy pulls the whole image, longer than the SSM waiter allows.
          for _ in $(seq 1 120); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$status" = Success ]
